# Application stack: REST API + translation worker (+ the one shot migration and
# seeder tools).
#
# MySQL and RabbitMQ are intentionally NOT defined here: in production they may
# run as containers (docker-compose.infra.yml), be installed on the operating
# system of the same server, or live on another server entirely. Point DB_HOST
# and RABBITMQ_URL in `.env.docker` to wherever they are and start this stack.
#
#   docker compose up -d --build            -> start API + worker
#   docker compose run --rm migrate         -> run the database migrations
#   docker compose run --rm seeder          -> seed the initial data
#   docker compose up -d --scale worker=3   -> more workers when the queue is busy
#
# `name` matches docker-compose.infra.yml so both files are the same compose
# project and share the `translator-net` network (containers of the infra stack
# are then reachable as `mysql` and `rabbitmq`).
name: translator-backend

# Shared settings of every service in this file.
x-app: &app
  build:
    context: .
  image: translator-backend:latest
  env_file: [.env]
  networks: [translator-net]
  # Makes `host.docker.internal` resolve on Linux as well, so the containers can
  # reach a MySQL/RabbitMQ that is installed directly on the host.
  extra_hosts:
    - 'host.docker.internal:host-gateway'

services:
  # One shot container that brings the schema up to date.
  #   docker compose run --rm migrate
  # It no longer waits for a `mysql` service, make sure the database is up (and
  # reachable from this server) before running it.
  migrate:
    <<: *app
    profiles: ['tools']
    restart: 'no'
    command:
      ['npx', 'typeorm', 'migration:run', '-d', 'dist/database/data-source.js']

  seeder:
    <<: *app
    profiles: ['tools']
    restart: 'no'
    command: ['node', 'dist/database/seeds/seed.js']

  api:
    <<: *app
    container_name: translator-api
    restart: unless-stopped
    environment:
      # The API only accepts requests, the worker container consumes the queues.
      ENABLE_HTTP: 'true'
      ENABLE_WORKER: 'false'
    command: ['node', 'dist/main.js']
    ports:
      - '${APP_EXPOSED_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    restart: unless-stopped
    # No `container_name` on purpose: this service is meant to be scaled
    # (`docker compose up -d --scale worker=3`) when the translation queue needs
    # more throughput.
    environment:
      ENABLE_HTTP: 'false'
      ENABLE_WORKER: 'true'
    command: ['node', 'dist/worker.js']

networks:
  # Shared with docker-compose.infra.yml: when MySQL/RabbitMQ run as containers
  # they are reachable by their service name (`mysql`, `rabbitmq`).
  translator-net:
    name: translator-net

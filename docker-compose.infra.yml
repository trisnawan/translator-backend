# Optional infrastructure stack: MySQL + RabbitMQ.
#
# This file is deliberately separate from `docker-compose.yml` (the application)
# so that in production the database and the broker can live wherever you want:
#
#   1. In Docker (this file):
#        docker compose -f docker-compose.infra.yml up -d
#   2. Installed on the operating system of the same server:
#        ignore this file, set DB_HOST=host.docker.internal in `.env.docker`.
#   3. On another server / managed service (RDS, CloudAMQP, ...):
#        ignore this file, set DB_HOST=db.example.com and RABBITMQ_URL to that host.
#
# The API/worker containers join the same `translator-net` network, so when this
# stack is running they reach the services below as `mysql` and `rabbitmq` (the
# values used by `.env.docker`).
#
#   docker compose -f docker-compose.infra.yml up -d     -> start MySQL + RabbitMQ
#   docker compose -f docker-compose.infra.yml ps        -> check the health status
#   docker compose -f docker-compose.infra.yml down      -> stop them (data is kept)
#   docker compose -f docker-compose.infra.yml down -v   -> stop them AND delete the data
#
# `name` must match docker-compose.yml, both files belong to the same project.
name: translator-backend

services:
  mysql:
    image: mysql:8.0
    container_name: translator-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      # Keep in sync with DB_USERNAME / DB_PASSWORD / DB_DATABASE of `.env.docker`.
      MYSQL_ROOT_PASSWORD: translator_root_password
      MYSQL_DATABASE: mdi_translator
    ports:
      # 3307 on the host so it does not clash with a local MySQL installation.
      - '${DB_EXPOSED_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - translator-net
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-ptranslator_root_password',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: translator-rabbitmq
    restart: unless-stopped
    environment:
      # Keep in sync with the credentials of RABBITMQ_URL in `.env.docker`.
      RABBITMQ_DEFAULT_USER: translator
      RABBITMQ_DEFAULT_PASS: translator_pass
    ports:
      - '${RABBITMQ_EXPOSED_PORT:-5673}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15673}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - translator-net
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

networks:
  # Shared with docker-compose.yml, so the API/worker resolve `mysql`/`rabbitmq`.
  translator-net:
    name: translator-net

volumes:
  mysql-data:
  rabbitmq-data:
